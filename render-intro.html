<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Unscripted — Curated Visual Heritage Cinematic Sequence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #06070a;
      overflow: hidden;
      font-family: 'Cinzel', serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #06070a;
    }

    /* Ambient Dust & Atmospheric Particles */
    #particlesCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Cinematic Camera Rig (Continuous Dolly & Slow Pan Space) */
    #cameraRig {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      will-change: transform;
    }

    .scene-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      will-change: opacity, transform;
    }

    /* ==========================================================
       SCENE 1: HERITAGE SANCTUARY ARCHWAY & CARVED RELIEF
       ========================================================== */
    #scene1 {
      justify-content: flex-start;
    }

    .sanctuary-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .pillar-svg {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: auto;
      max-width: 50vw;
      filter: drop-shadow(0 0 50px rgba(212, 175, 55, 0.2));
    }

    /* High-contrast Volumetric Chiaroscuro Sunbeam Rake */
    .sunbeam-cone {
      position: absolute;
      left: -10vw;
      top: -15vh;
      width: 90vw;
      height: 130vh;
      background: radial-gradient(ellipse 85% 70% at 15% 35%, 
                  rgba(254, 240, 138, 0.28) 0%, 
                  rgba(212, 175, 55, 0.16) 28%, 
                  rgba(180, 83, 9, 0.06) 55%, 
                  transparent 78%);
      mix-blend-mode: screen;
      pointer-events: none;
      transform: rotate(-12deg);
    }

    .scene1-text {
      position: absolute;
      right: 10vw;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      max-width: 46vw;
    }

    .scene1-eyebrow {
      font-family: 'Playfair Display', serif;
      font-size: clamp(14px, 1.8vw, 24px);
      letter-spacing: 0.38em;
      color: #c5a059;
      text-transform: uppercase;
      margin-bottom: 18px;
      text-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
    }

    .scene1-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(40px, 6.2vw, 90px);
      font-weight: 700;
      letter-spacing: 0.32em;
      color: #f8f6f0;
      text-shadow: 0 0 35px rgba(254, 240, 138, 0.55), 0 0 80px rgba(212, 175, 55, 0.3);
    }

    /* ==========================================================
       SCENE 2: CELESTIAL ASTROLABE COMPASS
       ========================================================== */
    .compass-container {
      position: relative;
      width: min(520px, 52vh);
      height: min(520px, 52vh);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .compass-ambient-glow {
      position: absolute;
      width: 145%;
      height: 145%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.35) 0%, rgba(180, 83, 9, 0.14) 45%, transparent 72%);
      filter: blur(25px);
    }

    .astrolabe-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 28px rgba(212, 175, 55, 0.5));
    }

    /* ==========================================================
       SCENE 3: AUTHENTIC SURVEY OF INDIA SUBCONTINENT & ROUTE
       ========================================================== */
    .subcontinent-wrapper {
      position: relative;
      width: min(740px, 84vh);
      height: min(830px, 94vh);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .subcontinent-glow-aura {
      position: absolute;
      width: 125%;
      height: 125%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.16) 0%, rgba(146, 111, 47, 0.06) 50%, transparent 75%);
      filter: blur(35px);
    }

    .authentic-map-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 18px rgba(197, 160, 89, 0.35));
    }

    /* ==========================================================
       SCENE 4: BRAND IDENTITY LOCKUP
       ========================================================== */
    .brand-lockup-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .brand-compass-icon {
      width: min(96px, 11vw);
      height: min(96px, 11vw);
      margin-bottom: 24px;
      filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.55));
    }

    .brand-name-india {
      font-size: clamp(34px, 4.6vw, 70px);
      font-weight: 700;
      letter-spacing: 0.34em;
      color: #f8f6f0;
      text-shadow: 0 0 25px rgba(254, 240, 138, 0.4);
      margin-bottom: 4px;
    }

    .brand-name-unscripted {
      font-size: clamp(36px, 5.0vw, 78px);
      font-weight: 700;
      letter-spacing: 0.36em;
      background: linear-gradient(135deg, #dfba73 0%, #fff8c5 35%, #d4af37 60%, #8a5e18 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 26px rgba(212, 175, 55, 0.6));
      margin-bottom: 22px;
      position: relative;
    }

    .brand-tagline {
      font-family: 'Space Mono', monospace;
      font-size: clamp(10px, 1.0vw, 15px);
      letter-spacing: 0.42em;
      color: rgba(197, 160, 89, 0.95);
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(197, 160, 89, 0.35);
    }

    /* ==========================================================
       SCENE 5: DAWN MOUNTAIN RIDGES & PROMISE
       ========================================================== */
    .dawn-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .dawn-sky-grad {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, 
                  #06070a 0%, 
                  #12101e 30%, 
                  #2e150d 58%, 
                  #6d320d 76%, 
                  #b45309 88%, 
                  #d4af37 96%, 
                  #fef08a 100%);
      opacity: 0.96;
    }

    .mountains-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50vh;
      pointer-events: none;
    }

    .promise-text-container {
      position: absolute;
      top: 38%;
      transform: translateY(-50%);
      text-align: center;
      z-index: 20;
    }

    .promise-text {
      font-size: clamp(22px, 3.2vw, 48px);
      font-weight: 600;
      letter-spacing: 0.38em;
      color: #f8f6f0;
      text-shadow: 0 0 30px rgba(254, 240, 138, 0.65), 0 0 60px rgba(212, 175, 55, 0.35);
      margin-bottom: 22px;
    }

    .promise-rule-container {
      position: relative;
      width: min(240px, 32vw);
      height: 2px;
      margin: 0 auto;
      background: rgba(212, 175, 55, 0.45);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.65);
    }

    .promise-star {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 14px #fff, 0 0 28px #fef08a;
    }

    /* Discreet Luxury Skip button */
    .intro-skip-btn {
      position: absolute;
      top: 28px;
      right: 36px;
      z-index: 999;
      background: rgba(6, 7, 10, 0.6);
      border: 1px solid rgba(197, 160, 89, 0.35);
      color: rgba(248, 246, 240, 0.8);
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      padding: 9px 18px;
      border-radius: 2px;
      cursor: pointer;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- Atmospheric Floating Dust Motes -->
    <canvas id="particlesCanvas"></canvas>

    <!-- Global Cinematic Camera Rig -->
    <div id="cameraRig">

      <!-- ================= SCENE 1: HERITAGE SANCTUARY ARCH ================= -->
      <div class="scene-layer" id="scene1">
        <div class="sanctuary-wrapper">
          <div class="sunbeam-cone"></div>
          
          <!-- Intricately Carved Rajput / Mughal Heritage Pillar & Multi-Cusped Arch -->
          <svg class="pillar-svg" viewBox="0 0 560 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="sandstonePillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#0a0c10" />
                <stop offset="25%" stop-color="#1f1813" />
                <stop offset="60%" stop-color="#4d361c" />
                <stop offset="85%" stop-color="#8c6426" />
                <stop offset="96%" stop-color="#d4af37" />
                <stop offset="100%" stop-color="#fef08a" />
              </linearGradient>

              <linearGradient id="sandstoneCarvingShade" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#06070a" stop-opacity="0.95" />
                <stop offset="50%" stop-color="#2a1e14" stop-opacity="0.8" />
                <stop offset="100%" stop-color="#5a3d1e" stop-opacity="0.6" />
              </linearGradient>

              <pattern id="jaliLattice" width="24" height="24" patternUnits="userSpaceOnUse">
                <path d="M 12 0 L 24 12 L 12 24 L 0 12 Z" fill="none" stroke="rgba(212, 175, 55, 0.25)" stroke-width="1" />
                <circle cx="12" cy="12" r="2.5" fill="rgba(254, 240, 138, 0.3)" />
              </pattern>
            </defs>

            <!-- 1. Multi-tiered Carved Plinth (Pitha) -->
            <rect x="0" y="860" width="280" height="220" fill="url(#sandstonePillarGrad)" />
            <!-- Plinth Moulding Steps & Relief Lines -->
            <line x1="0" y1="860" x2="280" y2="860" stroke="#fef08a" stroke-width="2.5" />
            <line x1="0" y1="885" x2="280" y2="885" stroke="#926f2f" stroke-width="1.8" />
            <rect x="15" y="895" width="245" height="40" fill="url(#sandstoneCarvingShade)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.2" />
            <!-- Lotus Frieze along Plinth Panel -->
            <path d="M 25,915 Q 40,900 55,915 Q 70,900 85,915 Q 100,900 115,915 Q 130,900 145,915 Q 160,900 175,915 Q 190,900 205,915 Q 220,900 235,915 Q 250,900 255,915" 
                  fill="none" stroke="rgba(254, 240, 138, 0.7)" stroke-width="1.5" />
            <line x1="0" y1="945" x2="280" y2="945" stroke="rgba(197, 160, 89, 0.5)" stroke-width="1.5" />

            <!-- 2. Main Fluted Shaft with Alternating Relief Grooves -->
            <rect x="35" y="240" width="190" height="620" fill="url(#sandstonePillarGrad)" />
            <!-- Fluted Shaft Grooves with 3D Depth Shading -->
            <line x1="65" y1="240" x2="65" y2="860" stroke="rgba(254, 240, 138, 0.25)" stroke-width="1.5" />
            <line x1="95" y1="240" x2="95" y2="860" stroke="rgba(10, 12, 16, 0.85)" stroke-width="2.8" />
            <line x1="125" y1="240" x2="125" y2="860" stroke="rgba(254, 240, 138, 0.35)" stroke-width="1.5" />
            <line x1="155" y1="240" x2="155" y2="860" stroke="rgba(10, 12, 16, 0.85)" stroke-width="2.8" />
            <line x1="185" y1="240" x2="185" y2="860" stroke="rgba(254, 240, 138, 0.55)" stroke-width="2" />
            <line x1="210" y1="240" x2="210" y2="860" stroke="rgba(10, 12, 16, 0.9)" stroke-width="2" />

            <!-- Horizontal Ornamental Mala / Garland Carved Bands -->
            <rect x="35" y="440" width="190" height="24" fill="url(#sandstoneCarvingShade)" stroke="rgba(212, 175, 55, 0.5)" stroke-width="1.2" />
            <line x1="35" y1="452" x2="225" y2="452" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="4 6" />
            <rect x="35" y="640" width="190" height="24" fill="url(#sandstoneCarvingShade)" stroke="rgba(212, 175, 55, 0.5)" stroke-width="1.2" />
            <line x1="35" y1="652" x2="225" y2="652" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="4 6" />

            <!-- 3. Rajasthani Corbelled Bracket Capital & Padma-Kosa (Lotus Rosette) -->
            <polygon points="15,240 245,240 270,185 0,185" fill="url(#sandstonePillarGrad)" />
            <line x1="0" y1="185" x2="270" y2="185" stroke="#fef08a" stroke-width="2.5" />
            <!-- Upper Bracket Tier -->
            <polygon points="0,185 270,185 295,130 -15,130" fill="url(#sandstonePillarGrad)" />
            <line x1="-15" y1="130" x2="295" y2="130" stroke="#fef08a" stroke-width="2" />

            <!-- 4. Multi-Cusped Scalloped Mughal/Rajput Arch Spandrel with Jali Inlay -->
            <path d="M 225,130 
                     C 285,130 330,110 355,80 
                     C 375,55 375,25 350,0 
                     L 0,0 L 0,130 Z" fill="url(#sandstonePillarGrad)" />

            <!-- Jali Lattice Accent in Arch Tympanum -->
            <path d="M 120,130 C 200,130 280,100 320,60 L 120,0 Z" fill="url(#jaliLattice)" opacity="0.65" />

            <!-- Multi-Cusped Scalloped Arch Curves -->
            <path d="M 225,130 
                     C 285,130 330,110 355,80 
                     C 375,55 375,25 350,0" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round" />

            <!-- Secondary Inner Arch Contour -->
            <path d="M 250,185 
                     C 320,185 365,160 395,125 
                     C 425,90 425,45 390,0" stroke="rgba(212, 175, 55, 0.7)" stroke-width="2.2" fill="none" />

            <!-- Hanging Temple Bell (Ghanta) Silhouette -->
            <path d="M 345,78 Q 345,130 335,152 L 355,152 Q 345,130 345,78 Z" fill="#926f2f" />
            <circle cx="345" cy="158" r="4.5" fill="#fef08a" />

            <!-- Brilliant Morning Specular Rim Light on Leading Pillar Edge -->
            <line x1="225" y1="130" x2="225" y2="860" stroke="#ffffff" stroke-width="3" opacity="0.95" />
            <line x1="225" y1="130" x2="225" y2="860" stroke="#fef08a" stroke-width="7" opacity="0.35" />
          </svg>

          <!-- Scene 1 Typography: Refined widely-spaced serif -->
          <div class="scene1-text">
            <div class="scene1-eyebrow">A Journey Through</div>
            <div class="scene1-title">INDIA</div>
          </div>
        </div>
      </div>

      <!-- ================= SCENE 2: CELESTIAL ASTROLABE COMPASS ================= -->
      <div class="scene-layer" id="scene2">
        <div class="compass-container">
          <div class="compass-ambient-glow"></div>
          
          <svg class="astrolabe-svg" id="astrolabeSvg" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="goldLightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="35%" stop-color="#fef08a" />
                <stop offset="85%" stop-color="#d4af37" />
                <stop offset="100%" stop-color="#926f2f" />
              </linearGradient>

              <linearGradient id="goldDarkFacet" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#c5a059" />
                <stop offset="55%" stop-color="#78350f" />
                <stop offset="100%" stop-color="#3b1d06" />
              </linearGradient>

              <radialGradient id="jewelFlare" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="35%" stop-color="#fef08a" />
                <stop offset="75%" stop-color="#d4af37" />
                <stop offset="100%" stop-color="#78350f" />
              </radialGradient>
            </defs>

            <!-- Outer Celestial Degree Ring -->
            <circle cx="250" cy="250" r="236" stroke="rgba(212, 175, 55, 0.85)" stroke-width="2.2" />
            <circle cx="250" cy="250" r="222" stroke="rgba(254, 240, 138, 0.5)" stroke-width="1.2" stroke-dasharray="3 5" />
            <circle cx="250" cy="250" r="202" stroke="rgba(197, 160, 89, 0.7)" stroke-width="1.5" />

            <!-- Degree Coordinate Ticks (72 intervals generated by JS) -->
            <g id="astrolabeTicks" stroke="rgba(212, 175, 55, 0.75)"></g>

            <!-- Inner Celestial Orbital Ring -->
            <circle cx="250" cy="250" r="176" stroke="rgba(212, 175, 55, 0.35)" stroke-width="1" stroke-dasharray="2 4" />

            <!-- Sacred Lotus Petal Rosette Mandala (Padma Geometry) -->
            <g stroke="rgba(212, 175, 55, 0.45)" stroke-width="1.2" fill="none">
              <!-- Cardinal Sacred Lotus Curves -->
              <path d="M 250,55 C 290,140 290,360 250,445 C 210,360 210,140 250,55 Z" />
              <path d="M 55,250 C 140,290 360,290 445,250 C 360,210 140,210 55,250 Z" />
              <!-- Diagonal Lotus Curves -->
              <g transform="rotate(45 250 250)">
                <path d="M 250,75 C 285,150 285,350 250,425 C 215,350 215,150 250,75 Z" stroke="rgba(212, 175, 55, 0.3)" />
                <path d="M 75,250 C 150,285 350,285 425,250 C 350,215 150,215 75,250 Z" stroke="rgba(212, 175, 55, 0.3)" />
              </g>
            </g>

            <!-- 8-Pointed Chiseled 3D Star Needles with Dual-tone Facets -->
            <!-- North Needle -->
            <polygon points="250,42 250,225 234,208" fill="url(#goldDarkFacet)" />
            <polygon points="250,42 250,225 266,208" fill="url(#goldLightFacet)" />
            <!-- South Needle -->
            <polygon points="250,458 250,275 234,292" fill="url(#goldLightFacet)" />
            <polygon points="250,458 250,275 266,292" fill="url(#goldDarkFacet)" />
            <!-- East Needle -->
            <polygon points="458,250 275,250 292,234" fill="url(#goldDarkFacet)" />
            <polygon points="458,250 275,250 292,266" fill="url(#goldLightFacet)" />
            <!-- West Needle -->
            <polygon points="42,250 225,250 208,234" fill="url(#goldLightFacet)" />
            <polygon points="42,250 225,250 208,266" fill="url(#goldDarkFacet)" />

            <!-- Diagonal Needles (NE, NW, SE, SW) -->
            <g transform="rotate(45 250 250)">
              <polygon points="250,82 250,225 237,214" fill="url(#goldDarkFacet)" />
              <polygon points="250,82 250,225 263,214" fill="url(#goldLightFacet)" />
              <polygon points="250,418 250,275 237,286" fill="url(#goldLightFacet)" />
              <polygon points="250,418 250,275 263,286" fill="url(#goldDarkFacet)" />
              <polygon points="418,250 275,250 286,237" fill="url(#goldDarkFacet)" />
              <polygon points="418,250 275,250 286,263" fill="url(#goldLightFacet)" />
              <polygon points="82,250 225,250 214,237" fill="url(#goldLightFacet)" />
              <polygon points="82,250 225,250 214,263" fill="url(#goldDarkFacet)" />
            </g>

            <!-- Center Sanctuary Core Cabochon Jewel -->
            <circle cx="250" cy="250" r="40" fill="#08090c" stroke="#d4af37" stroke-width="2.5" />
            <circle cx="250" cy="250" r="32" stroke="rgba(254, 240, 138, 0.4)" stroke-width="1" />
            <circle cx="250" cy="250" r="25" fill="url(#jewelFlare)" />
            <circle cx="247" cy="247" r="7" fill="#ffffff" opacity="0.95" />
          </svg>
        </div>
      </div>

      <!-- ================= SCENE 3: AUTHENTIC SURVEY OF INDIA SUBCONTINENT ================= -->
      <div class="scene-layer" id="scene3">
        <div class="subcontinent-wrapper">
          <div class="subcontinent-glow-aura"></div>
          
          <!-- Master Survey of India SVG Chassis (viewBox 0 0 800 900) -->
          <svg class="authentic-map-svg" id="authenticMapSvg" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="mapGoldFill" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#141724" stop-opacity="0.95" />
                <stop offset="50%" stop-color="#1b2030" stop-opacity="0.9" />
                <stop offset="100%" stop-color="#0f1118" stop-opacity="0.98" />
              </linearGradient>

              <filter id="routeGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            <!-- Internal Surveyor Graticule Grid Lines -->
            <g stroke="rgba(212, 175, 55, 0.08)" stroke-width="0.8" stroke-dasharray="3 5">
              <line x1="60" y1="125" x2="740" y2="125" />
              <line x1="60" y1="278" x2="740" y2="278" />
              <line x1="60" y1="450" x2="740" y2="450" />
              <line x1="60" y1="650" x2="740" y2="650" />
              <line x1="60" y1="813" x2="740" y2="813" />
              <line x1="111" y1="60" x2="111" y2="860" />
              <line x1="266" y1="60" x2="266" y2="860" />
              <line x1="406" y1="60" x2="406" y2="860" />
              <line x1="619" y1="60" x2="619" y2="860" />
            </g>

            <!-- Authentic 753 District Paths Container -->
            <g id="mapDistrictsGroup" fill="url(#mapGoldFill)" stroke="rgba(212, 175, 55, 0.35)" stroke-width="0.75">
              <!-- Dynamically populated from assets/intro/india_authentic_paths.json -->
            </g>

            <!-- Luminous Molten-Gold Flowing Bezier Spline Route -->
            <!-- Outer Amber Glow Spline -->
            <path id="moltenRouteGlow" 
                  d="M 274,125 C 272,185 268,225 266,278 C 285,315 345,340 406,372 C 345,460 265,545 246,650 C 236,705 240,760 243,813" 
                  fill="none" 
                  stroke="#f59e0b" 
                  stroke-width="5" 
                  stroke-linecap="round" 
                  stroke-linejoin="round"
                  filter="url(#routeGlow)" />

            <!-- Core Liquid Gold Spline -->
            <path id="moltenRouteLine" 
                  d="M 274,125 C 272,185 268,225 266,278 C 285,315 345,340 406,372 C 345,460 265,545 246,650 C 236,705 240,760 243,813" 
                  fill="none" 
                  stroke="#fef08a" 
                  stroke-width="2.5" 
                  stroke-linecap="round" 
                  stroke-linejoin="round" />

            <!-- Luminous Waypoint Beacons with High-Legibility Badge Cards -->
            <g id="waypointBeacons">
              <!-- Ladakh (274, 125) -->
              <g class="wp-group" data-idx="0" transform="translate(274, 125)">
                <circle class="wp-pulse" r="16" fill="none" stroke="rgba(254, 240, 138, 0.7)" stroke-width="1.2" />
                <circle class="wp-core" r="4.5" fill="#fef08a" />
                <rect x="12" y="-10" width="60" height="20" rx="3" fill="rgba(8, 9, 12, 0.85)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="0.8" />
                <text x="18" y="4" fill="#f8f6f0" font-family="'Space Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.1em">LADAKH</text>

              <!-- Delhi (266, 278) -->
              <g class="wp-group" data-idx="1" transform="translate(266, 278)">

                <circle class="wp-core" r="4.5" fill="#fef08a" />
                <rect x="12" y="-10" width="52" height="20" rx="3" fill="rgba(8, 9, 12, 0.85)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="0.8" />
                <text x="18" y="4" fill="#f8f6f0" font-family="'Space Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.1em">DELHI</text>
              </g>
              <!-- Varanasi (406, 372) -->
              <g class="wp-group" data-idx="2" transform="translate(406, 372)">
                <circle class="wp-pulse" r="16" fill="none" stroke="rgba(254, 240, 138, 0.7)" stroke-width="1.2" />
                <circle class="wp-core" r="4.5" fill="#fef08a" />
                <rect x="12" y="-10" width="68" height="20" rx="3" fill="rgba(8, 9, 12, 0.85)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="0.8" />
                <text x="18" y="4" fill="#f8f6f0" font-family="'Space Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.1em">VARANASI</text>
              </g>
              <!-- Hampi (246, 650) -->
              <g class="wp-group" data-idx="3" transform="translate(246, 650)">
                <circle class="wp-pulse" r="16" fill="none" stroke="rgba(254, 240, 138, 0.7)" stroke-width="1.2" />
                <circle class="wp-core" r="4.5" fill="#fef08a" />
                <rect x="12" y="-10" width="52" height="20" rx="3" fill="rgba(8, 9, 12, 0.85)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="0.8" />
                <text x="18" y="4" fill="#f8f6f0" font-family="'Space Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.1em">HAMPI</text>
              </g>
              <!-- Kerala (243, 813) -->
              <g class="wp-group" data-idx="4" transform="translate(243, 813)">
                <circle class="wp-pulse" r="16" fill="none" stroke="rgba(254, 240, 138, 0.7)" stroke-width="1.2" />
                <circle class="wp-core" r="4.5" fill="#fef08a" />
                <rect x="12" y="-10" width="58" height="20" rx="3" fill="rgba(8, 9, 12, 0.85)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="0.8" />
                <text x="18" y="4" fill="#f8f6f0" font-family="'Space Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.1em">KERALA</text>
              </g>
            </g>
          </svg>
        </div>
      </div>

      <!-- ================= SCENE 4: BRAND IDENTITY ================= -->
      <div class="scene-layer" id="scene4">
        <div class="brand-lockup-wrapper">
          <svg class="brand-compass-icon" viewBox="0 0 500 500" fill="none">
            <circle cx="250" cy="250" r="222" stroke="rgba(212, 175, 55, 0.75)" stroke-width="2.5" />
            <polygon points="250,50 250,225 234,208" fill="#926f2f" />
            <polygon points="250,50 250,225 266,208" fill="#fef08a" />
            <polygon points="250,450 250,275 234,292" fill="#fef08a" />
            <polygon points="250,450 250,275 266,292" fill="#926f2f" />
            <polygon points="450,250 275,250 292,234" fill="#926f2f" />
            <polygon points="450,250 275,250 292,266" fill="#fef08a" />
            <polygon points="50,250 225,250 208,234" fill="#fef08a" />
            <polygon points="50,250 225,250 208,266" fill="#926f2f" />
            <circle cx="250" cy="250" r="26" fill="#08090c" stroke="#d4af37" stroke-width="2.2" />
            <circle cx="250" cy="250" r="10" fill="#fef08a" />
          </svg>
          <div class="brand-name-india">INDIA</div>
          <div class="brand-name-unscripted">UNSCRIPTED</div>
          <div class="brand-tagline">· &nbsp;BESPOKE EXPEDITIONS&nbsp; ·</div>
        </div>
      </div>

      <!-- ================= SCENE 5: DAWN MOUNTAINS & PROMISE ================= -->
      <div class="scene-layer" id="scene5">
        <div class="dawn-wrapper">
          <div class="dawn-sky-grad"></div>
          
          <!-- Layered Himalayan & Ghats Dawn Silhouette Vector -->
          <svg class="mountains-svg" viewBox="0 0 1920 600" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Distant Jagged Himalayan Peaks -->
            <path d="M 0,600 L 0,360 L 160,290 L 340,380 L 560,240 L 740,330 L 960,195 L 1160,310 L 1400,225 L 1620,350 L 1920,270 L 1920,600 Z" 
                  fill="#141120" opacity="0.88" />
            
            <!-- Midground Western Ghats Forested Crests -->
            <path d="M 0,600 L 0,430 Q 220,350 460,400 Q 700,450 940,370 Q 1180,305 1420,410 Q 1660,470 1920,395 L 1920,600 Z" 
                  fill="#1b1216" opacity="0.92" />

            <!-- Foreground Base Foothills -->
            <path d="M 0,600 L 0,505 Q 360,465 740,515 Q 1120,555 1500,485 Q 1710,455 1920,525 L 1920,600 Z" 
                  fill="#06070a" />
          </svg>

          <!-- Promise Typography -->
          <div class="promise-text-container">
            <div class="promise-text">BEYOND THE ORDINARY</div>
            <div class="promise-rule-container">
              <div class="promise-star" id="promiseStar"></div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Skip Button -->
    <button class="intro-skip-btn" id="skipBtn" title="Skip Intro">Skip [Esc]</button>
  </div>

  <script>
    // Flag for headless video renderer
    window.mapReady = false;

    // Load Authentic Survey of India Boundaries
    fetch('assets/intro/india_authentic_paths.json')
      .then(res => res.json())
      .then(paths => {
        const group = document.getElementById('mapDistrictsGroup');
        if (group && paths) {
          let fragment = '';
          for (let i = 0; i < paths.length; i++) {
            fragment += `<path d="${paths[i]}" />`;
          }
          group.innerHTML = fragment;
          window.mapReady = true;
        }
      })
      .catch(e => {
        console.warn('Could not load district paths:', e);
        window.mapReady = true;
      });

    // Generate Astrolabe Degree Ticks (72 ticks)
    const ticksGroup = document.getElementById('astrolabeTicks');
    if (ticksGroup) {
      let ticks = '';
      for (let i = 0; i < 72; i++) {
        const deg = i * 5;
        const isCardinal = deg % 90 === 0;
        const isMajor = deg % 45 === 0;
        const r1 = isCardinal ? 204 : (isMajor ? 212 : 222);
        const r2 = 236;
        const rad = (deg * Math.PI) / 180;
        const x1 = 250 + Math.cos(rad) * r1;
        const y1 = 250 + Math.sin(rad) * r1;
        const x2 = 250 + Math.cos(rad) * r2;
        const y2 = 250 + Math.sin(rad) * r2;
        const sw = isCardinal ? 2.4 : (isMajor ? 1.5 : 0.9);
        ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="${sw}" />`;
      }
      ticksGroup.innerHTML = ticks;
    }

    // Atmospheric Floating Dust Particles
    const pCanvas = document.getElementById('particlesCanvas');
    const pCtx = pCanvas.getContext('2d');
    let pW, pH;

    function resizeParticles() {
      pW = pCanvas.width = window.innerWidth;
      pH = pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeParticles);
    resizeParticles();

    const particles = [];
    for (let i = 0; i < 120; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vy: -0.3 - Math.random() * 0.5,
        vx: (Math.random() - 0.5) * 0.3,
        size: 0.8 + Math.random() * 2.2,
        baseAlpha: 0.2 + Math.random() * 0.6,
        pulseSpeed: 1.5 + Math.random() * 2,
        phase: Math.random() * Math.PI * 2
      });
    }

    // Measure Route Line Length for smooth drawing
    const routeLine = document.getElementById('moltenRouteLine');
    const routeGlow = document.getElementById('moltenRouteGlow');
    let routeTotalLen = 1200;
    if (routeLine) {
      routeTotalLen = routeLine.getTotalLength() || 1200;
      routeLine.style.strokeDasharray = routeTotalLen;
      routeLine.style.strokeDashoffset = routeTotalLen;
      if (routeGlow) {
        routeGlow.style.strokeDasharray = routeTotalLen;
        routeGlow.style.strokeDashoffset = routeTotalLen;
      }
    }

    // Scene Elements
    const s1 = document.getElementById('scene1');
    const s2 = document.getElementById('scene2');
    const s3 = document.getElementById('scene3');
    const s4 = document.getElementById('scene4');
    const s5 = document.getElementById('scene5');
    const cameraRig = document.getElementById('cameraRig');
    const astrolabeSvg = document.getElementById('astrolabeSvg');
    const promiseStar = document.getElementById('promiseStar');
    const wpGroups = document.querySelectorAll('.wp-group');

    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }
    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }
    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val));
    }

    // MASTER CONTINUOUS TIMELINE CONTROLLER (7.5s total duration)
    const TOTAL_DURATION = 7.5;
    let startTime = null;
    let isManualSeek = false;

    window.seekTime = function(t) {
      isManualSeek = true;
      renderFrameAt(t);
    };

    function renderFrameAt(t) {
      // 1. Dust Particles
      pCtx.clearRect(0, 0, pW, pH);
      particles.forEach(p => {
        const curY = (p.y + p.vy * t * 60) % pH;
        const curX = (p.x + p.vx * t * 60) % pW;
        const py = curY < 0 ? curY + pH : curY;
        const px = curX < 0 ? curX + pW : curX;
        const alpha = p.baseAlpha * (0.6 + 0.4 * Math.sin(t * p.pulseSpeed + p.phase));

        pCtx.fillStyle = `rgba(254, 240, 138, ${alpha})`;
        pCtx.beginPath();
        pCtx.arc(px, py, p.size, 0, Math.PI * 2);
        pCtx.fill();
      });

      // 2. Slow Stately Camera Motion (Continuous dolly forward & subtle elevation shift)
      const zoom = 1.0 + (t / TOTAL_DURATION) * 0.085;
      const panY = Math.sin((t / TOTAL_DURATION) * Math.PI) * -6;
      cameraRig.style.transform = `scale(${zoom.toFixed(4)}) translateY(${panY.toFixed(2)}px)`;

      // 3. SCENE 1: HERITAGE SANCTUARY ARCHWAY (0.0s – 2.1s)
      let op1 = 0;
      if (t < 2.2) {
        if (t < 0.5) op1 = t / 0.5;
        else if (t < 1.6) op1 = 1.0;
        else op1 = clamp((2.1 - t) / 0.5, 0, 1);
        s1.style.transform = `translateX(${((1 - easeOutCubic(clamp(t / 1.5, 0, 1))) * -40).toFixed(1)}px)`;
      }
      s1.style.opacity = op1.toFixed(3);

      // 4. SCENE 2: CELESTIAL ASTROLABE COMPASS (1.5s – 3.7s)
      let op2 = 0;
      if (t >= 1.5 && t < 3.8) {
        if (t < 2.1) op2 = clamp((t - 1.5) / 0.6, 0, 1);
        else if (t < 3.0) op2 = 1.0;
        else op2 = clamp((3.6 - t) / 0.6, 0, 1);

        const rot = (t - 1.5) * 14 - 15;
        if (astrolabeSvg) astrolabeSvg.style.transform = `rotate(${rot.toFixed(2)}deg)`;
      }
      s2.style.opacity = op2.toFixed(3);

      // 5. SCENE 3: AUTHENTIC SURVEY OF INDIA SUBCONTINENT & ROUTE (2.9s – 5.5s)
      let op3 = 0;
      if (t >= 2.9 && t < 5.6) {
        if (t < 3.5) op3 = clamp((t - 2.9) / 0.6, 0, 1);
        else if (t < 4.8) op3 = 1.0;
        else op3 = clamp((5.5 - t) / 0.7, 0, 1);

        // Spline route drawing (3.2s to 4.7s)
        const routeProg = clamp((t - 3.2) / 1.5, 0, 1);
        const offsetVal = ((1 - easeInOutCubic(routeProg)) * routeTotalLen).toFixed(1);
        if (routeLine) routeLine.style.strokeDashoffset = offsetVal;
        if (routeGlow) routeGlow.style.strokeDashoffset = offsetVal;

        // Waypoint beacons reveal progressively
        wpGroups.forEach((wp, idx) => {
          const threshold = idx / 4.2;
          const wpOp = clamp((routeProg - threshold) * 4, 0, 1);
          wp.style.opacity = wpOp.toFixed(2);
        });
      }
      s3.style.opacity = op3.toFixed(3);

      // 6. SCENE 4: BRAND IDENTITY LOCKUP (4.7s – 6.7s)
      let op4 = 0;
      if (t >= 4.7 && t < 6.8) {
        if (t < 5.3) op4 = clamp((t - 4.7) / 0.6, 0, 1);
        else if (t < 6.1) op4 = 1.0;
        else op4 = clamp((6.7 - t) / 0.6, 0, 1);

        const liftY = (1 - easeOutCubic(clamp((t - 4.7) / 0.9, 0, 1))) * 25;
        s4.style.transform = `translateY(${liftY.toFixed(1)}px)`;
      }
      s4.style.opacity = op4.toFixed(3);

      // 7. SCENE 5: DAWN MOUNTAIN RIDGES & PROMISE (5.9s – 7.5s)
      let op5 = 0;
      if (t >= 5.9) {
        if (t < 6.6) op5 = clamp((t - 5.9) / 0.7, 0, 1);
        else if (t < 7.15) op5 = 1.0;
        else op5 = clamp((7.5 - t) / 0.35, 0, 1); // Soft swell and dissolve into live homepage

        const starProg = clamp((t - 6.2) / 1.0, 0, 1);
        if (promiseStar) {
          promiseStar.style.left = `${(starProg * 100).toFixed(1)}%`;
        }
      }
      s5.style.opacity = op5.toFixed(3);
    }

    // Animation Loop for live browser preview
    function animate(now) {
      if (isManualSeek) return;
      if (!startTime) startTime = now;
      const elapsed = (now - startTime) / 1000;

      renderFrameAt(elapsed);

      if (elapsed < TOTAL_DURATION) {
        requestAnimationFrame(animate);
      } else {
        document.body.style.transition = 'opacity 0.8s ease';
        document.body.style.opacity = '0';
      }
    }
    requestAnimationFrame(animate);

    document.getElementById('skipBtn').addEventListener('click', () => {
      document.body.style.transition = 'opacity 0.5s ease';
      document.body.style.opacity = '0';
    });
  </script>
